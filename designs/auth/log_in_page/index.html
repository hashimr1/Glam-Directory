<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Log In | Glam Directory</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ff5c61",
                        "background-light": "#f8f5f5",
                        "background-dark": "#230f0f",
                        "glam-dark": "#484848",
                        "glam-medium": "#767676",
                        "glam-border": "#DCE0E0"
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100">
<div class="flex min-h-screen">
<!-- Left Side: Editorial Image -->
<!-- Right Side: Login Form -->
<div class="w-full flex items-center justify-center bg-white dark:bg-background-dark px-6 py-12">
<div class="w-full max-w-[440px] flex flex-col">
<!-- Logo for mobile -->
<div class="mb-10">
<h2 class="text-[32px] font-bold text-glam-dark dark:text-slate-100 mb-2 leading-tight">Welcome Back</h2>
<p class="text-glam-medium dark:text-slate-400 text-lg">Log in to your professional account.</p>
</div>
<form class="space-y-5">
<div class="flex flex-col gap-2">
<label class="text-sm font-semibold text-glam-dark dark:text-slate-200">Email Address</label>
<input class="w-full rounded-lg border-glam-border dark:border-slate-700 bg-white dark:bg-slate-800 h-14 px-4 text-glam-dark dark:text-slate-100 focus:ring-2 focus:ring-primary focus:border-primary transition-all placeholder:text-glam-medium/50" placeholder="name@example.com" type="email"/>
</div>
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<label class="text-sm font-semibold text-glam-dark dark:text-slate-200">Password</label>
<a class="text-sm font-semibold text-primary hover:underline" href="#">Forgot Password?</a>
</div>
<input class="w-full rounded-lg border-glam-border dark:border-slate-700 bg-white dark:bg-slate-800 h-14 px-4 text-glam-dark dark:text-slate-100 focus:ring-2 focus:ring-primary focus:border-primary transition-all placeholder:text-glam-medium/50" placeholder="••••••••" type="password"/>
</div>
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-lg transition-all shadow-lg shadow-primary/20 mt-2" type="submit">
                        Log In
                    </button>
</form>
<div class="relative my-8">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-glam-border dark:border-slate-700"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="bg-white dark:bg-background-dark px-4 text-glam-medium uppercase tracking-wider font-medium text-xs">or continue with</span>
</div>
</div>
<button class="w-full flex items-center justify-center gap-3 border border-glam-border dark:border-slate-700 py-4 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-800 transition-all font-semibold text-glam-dark dark:text-slate-200">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                    Google
                </button>
<div class="mt-auto pt-10 text-center">
<p class="text-glam-medium dark:text-slate-400">
                        Don't have an account? 
                        <a class="text-primary font-bold hover:underline ml-1" href="#">Sign up</a>
</p>
</div>
</div>
</div>
</div>
</body></html>
